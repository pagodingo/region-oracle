<!doctype html>
<meta charset="utf-8">
<title>region-oracle</title>
<h1 id="region-oracle-title">region-oracle diagnostics</h1>
<button id="region-oracle-run">Run diagnostics</button>
<pre id="region-oracle-output"></pre>
<script>
document.getElementById("region-oracle-run").onclick = async () => {
  const r = await fetch("/api/diagnostics");
  document.getElementById("region-oracle-output").textContent = JSON.stringify(await r.json(), null, 2);
};
</script>
